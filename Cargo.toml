[package]
name = "php-std"
description = "PHP engine semantics (the value model, juggling and comparison, string, number, JSON, serialize, igbinary, sorting, filter and URL functions) for crates that must behave exactly like PHP."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/utopia-rs/php-std"

[dependencies]
bytes = "1"
# crypt(), password_*() and hash(): Argon2, Blowfish (EksBlowfish), MD5, SHA-1, SHA-2 and SHA-3 (RustCrypto).
argon2 = { version = "0.5", features = ["std"] }
blowfish = { version = "0.9", features = ["bcrypt"] }
foldhash = "0.2"
getrandom = "0.3"
gost94 = "0.10"
hashbrown = { version = "0.17", default-features = false }
indexmap = "2"
md-5 = "0.10"
md2 = "0.10"
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
ripemd = "0.1"
rustix = { version = "1", default-features = false, features = ["std", "fs", "system"] }
# Shortest round-trip float digits (serialize_precision = -1).
ryu = "1"
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
whirlpool = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# yaml_parse(): libyaml 0.2.5 translated to Rust, the parser ext-yaml links, so
# documents are accepted, refused and split into events exactly as in PHP.
unsafe-libyaml = "0.2"

[build-dependencies]
# PCRE2 10.44 with its JIT, from the sources PHP 8.5 bundles (pcre2/): the
# preg_* functions run user patterns, which must behave exactly as in PHP, and
# no Rust engine does (see src/pcre.rs).
cc = "1"

[package.metadata.utopia]
category = "platform"